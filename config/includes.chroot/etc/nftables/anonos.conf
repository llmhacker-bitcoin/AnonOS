#!/usr/sbin/nft -f

# AnonOS MVP - Deny-all firewall with Tor-only egress
# Flush existing rules
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # Allow loopback
        iif "lo" accept

        # Allow established/related
        ct state established,related accept
        ct state invalid drop

        # Drop all incoming connections (live system should not expose services)
        # ICMP limited for basic network health
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } limit rate 5/second accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, destination-unreachable, time-exceeded, nd-neighbor-solicit, nd-router-advert, nd-neighbor-advert } limit rate 5/second accept

        # Everything else dropped
        counter drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
        # No forwarding on a single-host live system
        counter drop
    }

    chain output {
        type filter hook output priority 0; policy drop;

        # Allow loopback
        oif "lo" accept

        # Allow root and tor user to talk to Tor network (transproxy DNS and OR connections)
        # Tor DNS proxy port
        meta skuid 0 udp dport 5353 accept
        meta skuid 0 tcp dport 9040 accept

        # Allow Tor daemon itself to connect to the Internet (it runs as debian-tor)
        # UID is dynamically applied by anonos-apply-firewall; this file is a template
        meta skuid 106 tcp dport { 443, 80 } accept
        meta skuid 106 tcp dport 9001 accept
        meta skuid 106 tcp dport 9030 accept

        # Allow only Tor-related local ports for other users (SOCKS + TransPort + DNSPort)
        # Any application must use these ports; direct internet egress is blocked
        tcp dport { 9050, 9150, 9040 } accept
        udp dport 5353 accept

        # Block all other outbound traffic
        counter drop
    }
}